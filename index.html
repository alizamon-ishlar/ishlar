<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Alizamon ishlar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ishlar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#f3f5f8; --card:#fff; --ink:#15202b; --mut:#667085; --line:#e3e7ee;
    --pri:#1f3a5f; --pri2:#2d5b91; --ok:#1a7f4b; --warn:#b54708; --bad:#c0262d; --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f141a; --card:#18202a; --ink:#e7ecf2; --mut:#93a0b0; --line:#273241;
      --pri:#5b8fd1; --pri2:#7aa7e0; --chip:#223041; --ok:#3fbf7f; --warn:#f0a050; --bad:#f06a6a; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0;flex:1;font-weight:600}
  header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;
    padding:8px 12px;font-size:14px}
  main{padding:12px 16px 110px;max-width:640px;margin:0 auto}

  /* PIN */
  #pinScr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;background:var(--pri);color:#fff}
  #pinScr h2{margin:0 0 4px;font-weight:600}
  #pinScr p{margin:0 0 20px;opacity:.8;font-size:14px}
  .dots{display:flex;gap:14px;margin-bottom:12px}
  .dots span{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
  .dots span.f{background:#fff}
  #pinMsg{min-height:22px;font-size:14px;color:#ffd2d2;margin-bottom:12px;text-align:center}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
  .pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
    color:#fff;font-size:28px}
  .pad button:active{background:rgba(255,255,255,.3)}
  .pad .t{font-size:15px;background:transparent}

  /* List */
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .stat b{display:block;font-size:17px}
  .stat small{color:var(--mut);font-size:12px}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 12px;font-size:14px}
  .filters button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    margin-bottom:10px}
  .item .top{display:flex;gap:8px;align-items:flex-start}
  .item .no{color:var(--mut);font-size:13px;min-width:26px}
  .item .ttl{font-weight:600;flex:1}
  .item .sub{color:var(--mut);font-size:14px;margin:2px 0 8px 34px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px}
  .tag{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:13px}
  .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
  .mud{margin:0 0 8px 34px;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600;
    display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .mud small{font-weight:500;opacity:.9}
  .mud.m-yashil{background:#e3f5ea;color:#146c3c}
  .mud.m-sariq{background:#fff4d1;color:#8a5a00}
  .mud.m-bugun{background:#ffe2c7;color:#a13d00}
  .mud.m-qizil{background:#fde2e2;color:#b3161d}
  .mud.m-tugadi{background:var(--chip);color:var(--mut)}
  .mud.m-tek{background:#e1ecfb;color:#1d4f91}
  .item.m-tek{border-left:5px solid #3a7bd5}
  .tekbtn{display:block;width:calc(100% - 34px);margin:8px 0 0 34px;padding:10px;border-radius:10px;
    border:1px dashed #3a7bd5;background:transparent;color:#2d6bc4;font-size:14px;font-weight:600}
  .tekqator{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip)}
  .tekqator input[type=checkbox]{width:22px;height:22px;flex:none}
  .tekqator label{margin:0;font-size:15px;color:var(--ink);flex:1}
  .tekqator input[type=date]{width:auto;flex:none;padding:8px}
  @media (prefers-color-scheme: dark){ .mud.m-tek{background:#1b2c45;color:#8fb8f0} }
  .item.m-yashil{border-left:5px solid #2e9e5b} .item.m-sariq{border-left:5px solid #e0a800}
  .item.m-bugun{border-left:5px solid #f07a1a} .item.m-qizil{border-left:5px solid #d92d2d}
  @media (prefers-color-scheme: dark){
    .mud.m-yashil{background:#173a26;color:#7fe0a6} .mud.m-sariq{background:#3d3212;color:#ffd666}
    .mud.m-bugun{background:#43260f;color:#ffab66} .mud.m-qizil{background:#451a1c;color:#ff8a8a}
  }
  .acts{display:flex;gap:8px;margin:10px 0 0 34px}
  .acts a,.acts button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);
    background:transparent;color:var(--pri2);border-radius:10px;padding:9px 4px;font-size:14px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px}
  .empty{text-align:center;color:var(--mut);padding:40px 10px}

  .fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;
    background:var(--pri);color:#fff;border:0;border-radius:16px;padding:16px 20px;
    font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}

  /* Form */
  .card{margin:0 0 14px;padding:14px;background:var(--card);border-radius:14px;
    border:1px solid var(--line)}
  .lg{font-weight:600;margin-bottom:2px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2>div{min-width:0}
  .row2 label{margin-top:10px}
  .ogoh{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600;font-size:15px;
    display:flex;align-items:center;gap:8px;cursor:pointer}
  .ogoh.bugun{background:#ffe2c7;color:#a13d00} .ogoh.otgan{background:#fde2e2;color:#b3161d}
  .ogoh small{font-weight:500;margin-left:auto;opacity:.8}
  .fayl{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;line-height:1.5;
    word-break:break-word}
  .fayl small{color:var(--mut)}
  .fayl a{color:var(--pri2);font-weight:600;text-decoration:none}
  input[type=file]{padding:9px;font-size:14px}
  .qoldiq{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);
    display:flex;justify-content:space-between;font-weight:600}
  .geo{display:flex;gap:10px;align-items:center;margin-top:8px}
  .geo .info{flex:1;font-size:14px}
  .geo .info b{display:block;font-size:15px}
  .geo button{border:1px solid var(--line);background:var(--bg);color:var(--pri2);
    border-radius:10px;padding:10px 12px;font-size:14px}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px}
  .savebar button{flex:1;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600}
  .btnSave{background:var(--pri);color:#fff}
  .btnCancel{background:var(--chip);color:var(--ink);flex:.5!important}
  .req{color:var(--bad)}

  /* Ishlar | EDO almashtirgich */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
  .seg button{border:0;background:transparent;color:var(--ink);border-radius:9px;padding:9px 6px;font-size:15px;font-weight:600}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg .son{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--pri);color:#fff;font-size:12px;line-height:20px}
  .seg .son.qizil{background:var(--bad)}
  .edo-mazmun{margin:0 0 8px 34px;font-size:15px}
  .edo-rez{margin:0 0 8px 34px;font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:8px}
  .acts button.asosiy{background:var(--pri);color:#fff;border-color:var(--pri)}
  .vaqt{color:var(--mut);font-size:12px;text-align:center;margin:4px 0 10px}

  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#15202b;
    color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;
    max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.on{opacity:1}
  #busy{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15;display:flex;
    align-items:center;justify-content:center}
  #busy div{width:42px;height:42px;border:4px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* v2: kirish, EDO ichki bo'limlar, fon yangilanishi */
  #kirishScr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;background:var(--pri);color:#fff}
  #kirishScr h2{margin:0 0 4px;font-weight:600}
  #kirishScr p{margin:0 0 18px;opacity:.85;font-size:14px;text-align:center;max-width:320px}
  #kirishScr form{width:100%;max-width:320px}
  #kirishScr input{background:#fff;color:#15202b;margin-bottom:10px;border:0}
  #kirishScr button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:#fff;color:var(--pri)}
  #kirishXabar{min-height:22px;font-size:14px;color:#ffd2d2;margin:4px 0 10px;text-align:center}
  .pinChiq{margin-top:22px;background:transparent;border:0;color:#fff;opacity:.75;font-size:14px;text-decoration:underline}
  header button.aylan{animation:sp 1s linear infinite}
  .ebolim{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .ebolim button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;
    font-size:13px;font-weight:600;line-height:1.25}
  .ebolim button b{display:block;font-size:18px}
  .ebolim button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .ebolim button .qiz{color:var(--bad)} .ebolim button.on .qiz{color:#ffd2d2}
  .yana{display:block;width:100%;margin:6px 0 20px;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--pri2);font-size:15px;font-weight:600}
  .oflayn{background:#fff4d1;color:#8a5a00;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
  @media (prefers-color-scheme: dark){ .oflayn{background:#3d3212;color:#ffd666} }

  /* Havolalar va sozlamalar */
  .hguruh{margin:0 0 14px;padding:4px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hguruh h3{margin:0;padding:12px 14px 6px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.2px}
  .havola{display:flex;align-items:center;gap:12px;padding:11px 14px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
  .havola:first-of-type{border-top:0}
  .havola .ik{width:34px;height:34px;flex:none;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:18px}
  .havola .mt{flex:1;min-width:0}
  .havola .mt b{display:block;font-size:15px;font-weight:600}
  .havola .mt small{display:block;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
  .havola .ok{color:var(--mut);font-size:18px}
  .havola:active{background:var(--chip)}
  .ornat{padding:14px}
  .ornat button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;background:var(--pri);color:#fff}
  .ornat p{margin:8px 0 0;font-size:13.5px;color:var(--mut);line-height:1.5}
  .nusxa{border:1px solid var(--line);background:transparent;color:var(--pri2);border-radius:8px;padding:6px 10px;font-size:13px;flex:none}

  /* Kompyuter ekrani: keng, ikki-uch ustunli */
  @media (min-width: 900px){
    #listScr main, #havolaScr main{max-width:1180px}
    #list, #edoList{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;align-items:start}
    #list .item, #edoList .item{margin:0}
    #list .empty, #edoList .empty, #edoList .yana{grid-column:1/-1}
    .stats{grid-template-columns:repeat(3,minmax(0,240px))}
    .seg, .ebolim{max-width:720px}
    .search{max-width:720px}
    #havolaScr main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
    #havolaScr .hguruh{margin:0}
  }
</style>
</head>
<body>

<!-- ===== Bazaga kirish (bir marta) ===== -->
<section id="kirishScr" class="hidden">
  <h2>Alizamon ishlar</h2>
  <p>Bir marta kiring — keyin faqat PIN-kod so'raladi</p>
  <form onsubmit="emailKirish();return false" autocomplete="on">
    <input id="kEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input id="kParol" type="password" placeholder="Parol" autocomplete="current-password" required>
    <div id="kirishXabar"></div>
    <button type="submit">Kirish</button>
  </form>
</section>

<!-- ===== PIN ekrani ===== -->
<section id="pinScr" class="hidden">
  <h2>Alizamon ishlar</h2>
  <p id="pinSarlavha">PIN-kodni kiriting</p>
  <div class="dots" id="dots"></div>
  <div id="pinMsg"></div>
  <div class="pad" id="pad"></div>
  <button class="pinChiq" onclick="chiqish()">Akkauntdan chiqish</button>
</section>

<!-- ===== Ro'yxat ===== -->
<section id="listScr" class="hidden">
  <header>
    <h1>Ishlar ro'yxati</h1>
    <button id="yBtn" onclick="yangila()" aria-label="Yangilash">↻</button>
    <button onclick="havolalar()" aria-label="Havolalar va sozlamalar">⚙️</button>
    <button onclick="qulfla()" aria-label="Qulflash">🔒</button>
  </header>
  <main>
    <div id="oflayn"></div>
    <div class="seg">
      <button id="segIsh" class="on" onclick="rejim('ish')">📋 Ishlar</button>
      <button id="segEdo" onclick="rejim('edo')">📥 EDO <span id="edoSon"></span></button>
    </div>
    <div id="ishView">
      <div id="ogoh"></div>
      <div class="stats" id="stats"></div>
      <input class="search" id="q" type="search" placeholder="Qidirish: obyekt, buyurtmachi, raqam…" oninput="chiz()">
      <div class="filters" id="filters"></div>
      <div id="list"></div>
    </div>
    <div id="edoView" class="hidden">
      <div class="ebolim" id="eBolim"></div>
      <div id="edoOgoh"></div>
      <input class="search" id="eq" type="search" placeholder="Qidirish: raqam, kimdan, mazmun…" oninput="EKOR=EBET;edoChiz()">
      <div class="filters" id="edoFilters"></div>
      <div id="edoList"></div>
    </div>
  </main>
  <button class="fab" id="fab" onclick="ochForm()">＋ Yangi ish</button>
</section>

<!-- ===== Havolalar va sozlamalar ===== -->
<section id="havolaScr" class="hidden">
  <header>
    <button onclick="korsat('listScr')" aria-label="Orqaga">←</button>
    <h1>Havolalar va sozlamalar</h1>
    <button onclick="qulfla()" aria-label="Qulflash">🔒</button>
  </header>
  <main id="havolaMain"></main>
</section>

<!-- ===== Forma ===== -->
<section id="formScr" class="hidden">
  <header>
    <h1 id="fTitle">Yangi ish</h1>
    <button onclick="qulfla()">🔒</button>
  </header>
  <main>
    <form id="f" onsubmit="return false" autocomplete="off">
      <input type="hidden" name="row">
      <div class="card">
        <div class="lg">Obyekt</div>
        <label>Obyekt manzili va nomlanishi <span class="req">*</span></label>
        <textarea name="obyekt" rows="2" required></textarea>
        <label>Hajmi</label>
        <input name="hajm" placeholder="masalan: 3 qavat, 450 m²">
        <label>Lokatsiya (avtomatik)</label>
        <div class="geo">
          <div class="info" id="geoInfo">Aniqlanmoqda…</div>
          <button type="button" onclick="joylashuv(true)">📍 Yangilash</button>
        </div>
        <div class="row2">
          <div><label>Kenglik (lat)</label><input name="lat" inputmode="decimal"></div>
          <div><label>Uzunlik (lng)</label><input name="lng" inputmode="decimal"></div>
        </div>
      </div>

      <div class="card">
        <div class="lg">Buyurtmachi</div>
        <label>Buyurtmachi nomi</label>
        <input name="buyurtmachi">
        <label>Bog'lanish telefoni</label>
        <input name="telefon" type="tel" inputmode="tel" placeholder="+998 __ ___ __ __">
      </div>

      <div class="card">
        <div class="lg">Ariza va xulosa</div>
        <div class="row2">
          <div><label>Ariza raqami</label><input name="ariza"></div>
          <div><label>Xulosa raqami</label><input name="xulosa"></div>
        </div>
        <div class="row2">
          <div><label>Kelgan sana</label><input name="kelgan" type="date"></div>
          <div><label>Bajarish muddati</label><input name="muddat" type="date"></div>
        </div>
        <div class="tekqator">
          <input type="checkbox" id="tekCh" onchange="tekCheck(this)">
          <label for="tekCh">🔍 Binoga borib tekshirildi</label>
          <input name="tekshirildi" type="date" onchange="$('tekCh').checked=!!this.value">
        </div>
      </div>

      <div class="card">
        <div class="lg">Xulosa fayli</div>
        <div class="fayl" id="faylJoriy">Fayl yuklanmagan</div>
        <label>Tayyor xulosani tanlang (PDF, Word yoki rasm)</label>
        <input name="fayl" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,image/*" onchange="faylTanlandi(this)">
      </div>

      <div class="card">
        <div class="lg">Shartnoma va to'lov</div>
        <div class="row2">
          <div><label>Shartnoma raqami</label><input name="shartnoma"></div>
          <div><label>Shartnoma sanasi</label><input name="shSana" type="date"></div>
        </div>
        <label>Shartnoma summasi (so'm)</label>
        <input name="summa" inputmode="numeric" oninput="pulInput(this)">
        <label>Tushgan summa (so'm)</label>
        <input name="tushgan" inputmode="numeric" oninput="pulInput(this)">
        <div class="qoldiq"><span>Qoldiq</span><span id="qoldiq">—</span></div>
      </div>

      <div class="card">
        <div class="lg">Izoh</div>
        <textarea name="izoh"></textarea>
      </div>
    </form>
  </main>
  <div class="savebar">
    <button class="btnCancel" onclick="orqaga()">Bekor</button>
    <button class="btnSave" onclick="saqla()">Saqlash</button>
  </div>
</section>

<div id="toast"></div>
<div id="busy" class="hidden"><div></div></div>

<script>
/* ===== Baza (Supabase) — ochiq manzil va ochiq (anon) kalit; ma'lumotni faqat kirgan egasi ko'radi ===== */
const SB_URL = 'https://sahaiisdilulydstrdwd.supabase.co';
const SB_KEY = 'sb_publishable_NAddx0WzT3KsPRKASwuuHQ_vCdWVvxw';

const PIN_LEN = 4;
const AUTO_QULF_DAQ = 5;
const MAX_URINISH = 5, BLOK_DAQ = 15;

let DATA = [], EDO = [], FILTR = 'hammasi', pin = '', OCHIQ = false, pinYangi = null;
const $ = id => document.getElementById(id);
const F = () => $('f').elements;

/* ---------- Yordamchilar ---------- */
function toast(t, ms){ const e=$('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove('on'), ms||2500); }
function band(on){ $('busy').classList.toggle('hidden', !on); }
function korsat(id){ ['kirishScr','pinScr','listScr','formScr','havolaScr'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }
function num(v){ if(v===''||v==null) return null; const n=Number(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?null:n; }
function pul(n){ return n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm"; }
function bugun(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function sanaUz(s){ if(!s) return ''; const p=String(s).slice(0,10).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : s; }
function kunQoldi(s){ if(!s) return null; const a=new Date(String(s).slice(0,10)+'T00:00:00'), b=new Date(bugun()+'T00:00:00'); return Math.round((a-b)/864e5); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- Supabase mijozi (kutubxonasiz) ---------- */
function sessiyaSaqla(j){ ls.set('sb_sessiya', { access:j.access_token, refresh:j.refresh_token,
  tugaydi: Date.now() + (Number(j.expires_in)||3600)*1000, email: j.user && j.user.email }); }
async function sbToken(){
  const s = ls.get('sb_sessiya');
  if (!s || !s.refresh) return null;
  if (s.access && s.tugaydi - 120e3 > Date.now()) return s.access;
  if (sbToken._p) return sbToken._p;               // bir vaqtda bitta yangilash
  sbToken._p = (async () => {
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', { method:'POST',
      headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: s.refresh }) });
    if (!r.ok) { if (r.status>=400 && r.status<500) ls.del('sb_sessiya'); return null; }
    const j = await r.json(); sessiyaSaqla(j); return j.access_token;
  })().finally(()=>{ sbToken._p = null; });
  return sbToken._p;
}
async function sb(path, { method='GET', body, headers={}, raw } = {}){
  let t;
  try { t = await sbToken(); } catch(e){ throw new Error('Internet aloqasi yo\'q'); }
  if (!t) { kirishKerak(); throw new Error('Qayta kirish kerak'); }
  let r;
  try {
    r = await fetch(SB_URL+path, { method, body: raw ? body : (body===undefined ? undefined : JSON.stringify(body)),
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+t, ...(raw?{}:{'Content-Type':'application/json'}), ...headers } });
  } catch(e){ throw new Error('Internet aloqasi yo\'q'); }
  if (r.status===401) { ls.del('sb_sessiya'); kirishKerak(); throw new Error('Qayta kirish kerak'); }
  if (!r.ok) { const m = await r.text().catch(()=> ''); throw new Error('Server: '+r.status+' '+m.slice(0,120)); }
  const matn = await r.text();             // bo'sh javob (return=minimal) ham bo'lishi mumkin
  try { return matn ? JSON.parse(matn) : null; } catch (e) { return null; }
}
async function sbHammasi(path){
  let all = [];
  for (let off=0; ; off+=1000){
    const q = await sb(path + (path.includes('?')?'&':'?') + 'limit=1000&offset=' + off);
    all = all.concat(q); if (q.length < 1000) return all;
  }
}
const xavfsizNom = s => String(s||'fayl').replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80) || 'fayl';
async function faylYukla(papka, file){
  const yol = papka + '/' + Date.now() + '_' + xavfsizNom(file.name);
  await sb('/storage/v1/object/fayllar/'+yol, { method:'POST', raw:true, body:file,
    headers:{ 'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' } });
  return yol;
}
/* Yopiq fayl: 1 soatlik vaqtinchalik havola bilan ochiladi */
async function ochFayl(yol){
  const w = window.open('', '_blank');
  try {
    const j = await sb('/storage/v1/object/sign/fayllar/'+yol, { method:'POST', body:{ expiresIn: 3600 } });
    const url = SB_URL + '/storage/v1' + (j.signedURL || j.signedUrl);
    if (w) w.location.href = url; else location.href = url;
  } catch(e){ if (w) w.close(); toast('Fayl ochilmadi: '+e.message, 4000); }
}

/* ---------- Kirish (bir marta) ---------- */
function kirishKerak(){ OCHIQ=false; korsat('kirishScr'); }
async function emailKirish(){
  const email = $('kEmail').value.trim(), parol = $('kParol').value;

  try {
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password', { method:'POST',

    const j = await r.json().catch(()=>({}));

  } catch(e){ $('kirishXabar').textContent = e.message === 'Failed to fetch' ? 'Internet aloqasi yo\'q' : e.message; }

function chiqish(){
  if (!confirm('Akkauntdan chiqasizmi? Keyingi safar email va parol so\'raladi.')) return;
  const s = ls.get('sb_sessiya');
  if (s && s.access) fetch(SB_URL+'/auth/v1/logout', { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+s.access } }).catch(()=>{});
  ['sb_sessiya','pin_hash','kesh_v2','pin_xato'].forEach(ls.del);
  DATA=[]; EDO=[]; OCHIQ=false; korsat('kirishScr');
}

/* ---------- PIN (telefonning o'zida tekshiriladi) ---------- */
async function xesh(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('alizamon:'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function pinChiz(){ $('dots').innerHTML = Array.from({length:PIN_LEN},(_,i)=>`<span class="${i<pin.length?'f':''}"></span>`).join(''); }
(function(){ const k=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pad').innerHTML = k.map(x=> x===''?'<span></span>':`<button class="${x==='⌫'?'t':''}" data-k="${x}">${x}</button>`).join('');
  $('pad').onclick = e => { const k=e.target.dataset && e.target.dataset.k; if(!k) return;
    if (k==='⌫') pin=pin.slice(0,-1); else if (pin.length<PIN_LEN) pin+=k;
    pinChiz(); if (pin.length===PIN_LEN) pinTayyor(); };
  pinChiz();
})();
let PIN_REJIM = 'kirish';
function pinBosqich(r){
  PIN_REJIM = r; pin=''; pinYangi=null; pinChiz(); $('pinMsg').textContent='';
  $('pinSarlavha').textContent = r==='yangi' ? 'Yangi PIN-kod o\'ylab toping (4 raqam)' : 'PIN-kodni kiriting';
  korsat('pinScr');
}
async function pinTayyor(){
  const p = pin; pin=''; setTimeout(pinChiz, 150);
  if (PIN_REJIM==='yangi') {
    if (!pinYangi) { pinYangi = p; $('pinSarlavha').textContent='PIN-kodni yana bir marta kiriting'; return; }
    if (pinYangi !== p) { pinYangi=null; $('pinSarlavha').textContent='Yangi PIN-kod o\'ylab toping (4 raqam)';
      $('pinMsg').textContent='Ikki PIN bir xil emas, qaytadan'; return; }
    ls.set('pin_hash', await xesh(p)); return ochildi();
  }
  const x = ls.get('pin_xato') || { soni:0, gacha:0 };
  if (x.gacha > Date.now()) { $('pinMsg').textContent = 'Juda ko\'p noto\'g\'ri urinish. '+Math.ceil((x.gacha-Date.now())/60000)+' daqiqadan keyin urining.'; return; }
  if (await xesh(p) === ls.get('pin_hash')) { ls.del('pin_xato'); return ochildi(); }
  x.soni++; if (x.soni >= MAX_URINISH) { x.gacha = Date.now()+BLOK_DAQ*60000; x.soni=0; }
  ls.set('pin_xato', x);
  $('pinMsg').textContent = x.gacha > Date.now() ? 'Bloklandi: '+BLOK_DAQ+' daqiqa kuting' : 'PIN noto\'g\'ri. Qolgan urinishlar: '+(MAX_URINISH-x.soni);
  if (navigator.vibrate) navigator.vibrate(200);
}
function ochildi(){
  OCHIQ = true; $('pinMsg').textContent='';
  keshdanOl(); korsat('listScr'); chiz(); edoChiz(); faollik();
  yangila();
}
function qulfla(){ OCHIQ=false; DATA=[]; EDO=[]; $('list').innerHTML=''; $('edoList').innerHTML=''; pinBosqich('kirish'); }

let _qt; function faollik(){ clearTimeout(_qt); if(OCHIQ) _qt=setTimeout(()=>{ qulfla(); toast('Avtomatik qulflandi'); }, AUTO_QULF_DAQ*60000); }
['click','keydown','touchstart','input'].forEach(ev=>document.addEventListener(ev, faollik, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) window._yashirin=Date.now();
  else if(OCHIQ && window._yashirin && Date.now()-window._yashirin > AUTO_QULF_DAQ*60000) qulfla();
  else if(OCHIQ && window._yashirin && Date.now()-window._yashirin > 60000) yangila(true); });

/* ---------- Telefondagi nusxa (kesh) + faqat o'zgarganlarini yuklash ---------- */
let KESH = { ishlar:[], edo:[], ishVaqt:null, edoVaqt:null, vaqt:0 };
function ishUi(d){
  return { row:d.id, n:d.n, obyekt:d.obyekt||'', buyurtmachi:d.buyurtmachi||'', telefon:d.telefon||'', ariza:d.ariza||'',
    kelgan:d.kelgan||'', muddat:d.muddat||'', xulosa:d.xulosa||'', shartnoma:d.shartnoma||'', shSana:d.sh_sana||'',
    summa:d.summa==null?'':d.summa, tushgan:d.tushgan==null?'':d.tushgan, qoldiq:'', hajm:d.hajm||'',
    lat:d.lat||'', lng:d.lng||'', izoh:d.izoh||'', tekshirildi:d.tekshirildi||'',
    fayl: d.fayl_path ? { path:d.fayl_path, nom:d.fayl_nom||'Xulosa' } : d.fayl_url ? { url:d.fayl_url, nom:d.fayl_nom||'Xulosa' } : null };
}
function keshdanOl(){
  const k = ls.get('kesh_v2');
  if (k && Array.isArray(k.ishlar)) KESH = k;
  DATA = KESH.ishlar.map(ishUi).sort((a,b)=>(a.n||0)-(b.n||0)||a.row-b.row);
  EDO = KESH.edo.slice();
}
function birlashtir(eski, yangi){
  if (!yangi.length) return eski;
  const m = new Map(eski.map(x=>[x.id,x])); yangi.forEach(x=>m.set(x.id,x)); return [...m.values()];
}
const engKechi = (a, v) => a.reduce((m,x)=> x.updated_at > (m||'') ? x.updated_at : m, v);
function keshgaYoz(){ KESH.vaqt = Date.now(); if (!ls.set('kesh_v2', KESH)) { /* joy tugasa — mazmun bilan emas, faqat ro'yxat */ } }

async function yangila(jim){
  if (!OCHIQ || yangila._ish) return;
  yangila._ish = true;
  const birinchi = !KESH.vaqt;
  if (birinchi) band(true); else $('yBtn').classList.add('aylan');
  try {
    // 5 daqiqa ustma-ust olamiz — bir vaqtda yozilgan o'zgarishlar tushib qolmasin
    const oldin = v => new Date(new Date(v).getTime() - 300000).toISOString();
    const iq = KESH.ishVaqt ? '&updated_at=gt.'+encodeURIComponent(oldin(KESH.ishVaqt)) : '';
    const eq = KESH.edoVaqt ? '&updated_at=gt.'+encodeURIComponent(oldin(KESH.edoVaqt)) : '';
    const [ish, edo] = await Promise.all([
      sbHammasi('/rest/v1/ishlar?select=*&order=updated_at.asc'+iq),
      sbHammasi('/rest/v1/edo?select=id,bolim,reg,sana,kimdan,mazmun,rez,muddat,holat,oqilgan,ijrochilar,doc_id,recipient_id,kelgan,fayl_path,fayl_nom,ish_id,updated_at&order=updated_at.asc'+eq)
    ]);
    KESH.ishlar = birlashtir(KESH.ishlar, ish); KESH.ishVaqt = engKechi(ish, KESH.ishVaqt);
    KESH.edo = birlashtir(KESH.edo, edo);     KESH.edoVaqt = engKechi(edo, KESH.edoVaqt);
    keshgaYoz(); keshdanOl();
    $('oflayn').innerHTML = '';
    if (OCHIQ) { chiz(); edoChiz(); }

  } catch(e){
    if (OCHIQ) $('oflayn').innerHTML = `<div class="oflayn">⚠ ${esc(e.message)} — telefondagi nusxa ko'rsatilmoqda${KESH.vaqt?' ('+new Date(KESH.vaqt).toLocaleString('ru-RU')+')':''}</div>`;
  }
  band(false); $('yBtn').classList.remove('aylan'); yangila._ish = false;
}
function ishniKeshga(d){ KESH.ishlar = birlashtir(KESH.ishlar,[d]); KESH.ishVaqt = engKechi([d], KESH.ishVaqt); keshgaYoz(); keshdanOl(); }
function edoniKeshga(d){ KESH.edo = birlashtir(KESH.edo,[d]); KESH.edoVaqt = engKechi([d], KESH.edoVaqt); keshgaYoz(); keshdanOl(); }

/* ---------- Ishlar ro'yxati ---------- */
function holat(r){
  const q = num(r.qoldiq!=='' && r.qoldiq!=null ? r.qoldiq : (num(r.summa)!=null ? num(r.summa)-(num(r.tushgan)||0) : null));
  const k = kunQoldi(r.muddat);
  const tugagan = !!String(r.xulosa||'').trim();
  const tek = !tugagan && !!r.tekshirildi;
  const kuzat = !tugagan && !tek;
  return { q, k, tugagan, tek, qarz: q!=null && q>0, kechikkan: kuzat && k!=null && k<0, yaqin: kuzat && k!=null && k>=0 && k<=3 };
}
function muddatHolat(r, h){
  if (!r.muddat && !h.tek) return null;
  const sana = sanaUz(r.muddat), k = h.k;
  if (h.tugagan) return { cls:'m-tugadi', chap:'✓ Muddat: '+sana, ong:'Bajarilgan' };
  if (h.tek)     return { cls:'m-tek', chap:'🔍 Tekshirildi: '+sanaUz(r.tekshirildi), ong:'Xulosa kutilmoqda' };
  if (k < 0)   return { cls:'m-qizil',  chap:'🔴 Muddat o\'tdi: '+sana, ong:(-k)+' kun kechikdi' };
  if (k === 0) return { cls:'m-bugun',  chap:'🟠 Muddat BUGUN: '+sana, ong:'Bugun topshirish kerak' };
  if (k <= 3)  return { cls:'m-sariq',  chap:'🟡 Muddat: '+sana, ong:k+' kun qoldi' };
  return { cls:'m-yashil', chap:'🟢 Muddat: '+sana, ong:k+' kun qoldi' };
}
function faylTugma(f, matn){
  if (!f) return '';
  return f.path ? `<button onclick="ochFayl('${esc(f.path)}')">${matn}</button>` : `<a href="${esc(f.url)}" target="_blank">${matn}</a>`;
}
const FILTRLAR = [['hammasi','Hammasi'],['bugun','Bugun muddat'],['jarayonda','Jarayonda'],['kechikkan','Muddati o\'tgan'],['tek','Xulosa kutilmoqda'],['qarz','Qoldiq bor'],['tugagan','Xulosa berilgan']];
function chiz(){
  const q = $('q').value.trim().toLowerCase();
  let jamiQ=0, jarayon=0, kech=0;
  DATA.forEach(r=>{ const h=holat(r); if(h.qarz) jamiQ+=h.q; if(!h.tugagan) jarayon++; if(h.kechikkan) kech++; });
  $('stats').innerHTML = `<div class="stat"><b>${DATA.length}</b><small>Jami ish</small></div>
    <div class="stat"><b>${jarayon}</b><small>Jarayonda${kech?` · <span style="color:var(--bad)">${kech} kechikkan</span>`:''}</small></div>
    <div class="stat"><b>${jamiQ?Math.round(jamiQ/1e6*10)/10+' mln':'0'}</b><small>Umumiy qoldiq</small></div>`;
  const bugungi = DATA.filter(r=>{const h=holat(r); return !h.tugagan && !h.tek && h.k===0;});
  let og = '';
  if (bugungi.length) og += `<div class="ogoh bugun" onclick="FILTR='bugun';chiz()">🔔 Bugun muddati tugaydi: ${bugungi.length} ta ish<small>Ko'rish ›</small></div>`;
  if (kech) og += `<div class="ogoh otgan" onclick="FILTR='kechikkan';chiz()">⚠ Muddati o'tgan: ${kech} ta ish<small>Ko'rish ›</small></div>`;
  $('ogoh').innerHTML = og;
  $('filters').innerHTML = FILTRLAR.map(([k,t])=>`<button class="${FILTR===k?'on':''}" onclick="FILTR='${k}';chiz()">${t}</button>`).join('');

  const rows = DATA.filter(r=>{
    const h = holat(r);
    if (FILTR==='jarayonda' && h.tugagan) return false;
    if (FILTR==='kechikkan' && !h.kechikkan) return false;
    if (FILTR==='qarz' && !h.qarz) return false;
    if (FILTR==='tugagan' && !h.tugagan) return false;
    if (FILTR==='bugun' && !(h.k===0 && !h.tugagan && !h.tek)) return false;
    if (FILTR==='tek' && !h.tek) return false;
    if (!q) return true;
    return [r.n,r.obyekt,r.buyurtmachi,r.telefon,r.ariza,r.xulosa,r.shartnoma,r.izoh].join(' ').toLowerCase().includes(q);
  }).slice().reverse();

  if (!rows.length) { $('list').innerHTML = `<div class="empty">${DATA.length?'Hech narsa topilmadi':'Hozircha ish yo\'q.<br>Pastdagi “＋ Yangi ish” tugmasini bosing.'}</div>`; return; }

  $('list').innerHTML = rows.map(r=>{
    const h = holat(r); const tags=[];
    if (h.tugagan) tags.push(`<span class="tag ok">✓ Xulosa № ${esc(r.xulosa)}</span>`);
    const m = muddatHolat(r, h);
    if (h.q!=null) tags.push(`<span class="tag ${h.qarz?'warn':'ok'}">${h.qarz?'Qoldiq: '+pul(h.q):'To\'langan'}</span>`);
    if (r.ariza) tags.push(`<span class="tag">Ariza № ${esc(r.ariza)}</span>`);
    const tel = String(r.telefon||'').replace(/[^\d+]/g,'');
    return `<div class="item ${m?m.cls:''}">
      <div class="top"><span class="no">${esc(r.n)}</span><span class="ttl">${esc(r.obyekt)}</span></div>
      <div class="sub">${esc(r.buyurtmachi||'—')}${r.kelgan?' · '+sanaUz(r.kelgan):''}</div>
      ${m?`<div class="mud ${m.cls}"><span>${m.chap}</span><small>${m.ong}</small></div>`:''}
      ${!h.tugagan && !h.tek ? `<button class="tekbtn" onclick="tekBelgila(${r.row})">🔍 Binoga borib tekshirildi — belgilash</button>` : ''}
      <div class="tags">${tags.join('')}</div>
      <div class="acts">
        ${tel?`<a href="tel:${tel}">📞 Qo'ng'iroq</a>`:''}
        ${r.lat&&r.lng?`<a href="https://www.google.com/maps?q=${encodeURIComponent(r.lat)},${encodeURIComponent(r.lng)}" target="_blank">🗺 Xarita</a>`:''}
        ${faylTugma(r.fayl,'📄 Xulosa')}
        <button onclick="ochForm(${r.row})">✎ Tahrirlash</button>
      </div></div>`;
  }).join('');
}

/* ---------- EDO: Ijro uchun / Murojaatlar / Ma'lumot uchun ---------- */
let EBOLIM = 'ijro', EFILTR = 'faol', REJIM = 'ish';
const EBET = 60; let EKOR = EBET;
const BOLIMLAR = [['ijro','📌','Ijro uchun','for-execution'],['murojaat','📨','Murojaatlar','for-appeal'],['malumot','ℹ️','Ma\'lumot uchun','for-information']];
function rejim(r){
  REJIM = r;
  $('segIsh').classList.toggle('on', r==='ish'); $('segEdo').classList.toggle('on', r==='edo');
  $('ishView').classList.toggle('hidden', r!=='ish'); $('edoView').classList.toggle('hidden', r!=='edo');
  $('fab').classList.toggle('hidden', r!=='ish');
  window.scrollTo(0,0);
}
function eBolimTanla(b){ EBOLIM=b; EFILTR = 'faol'; EKOR=EBET; edoChiz(); window.scrollTo(0,0); }
function edoHolat(r){
  const faol = Number(r.holat) < 20;
  const k = r.bolim==='malumot' ? null : kunQoldi(r.muddat);
  return { faol, k, kechikkan: faol && k!=null && k<0 };
}
function edoMuddat(r, h){
  if (r.bolim==='malumot') return h.faol ? { cls:'m-sariq', chap:'👁 Ko\'rilmagan', ong:'' } : null;
  if (!r.muddat) return h.faol ? { cls:'m-yashil', chap:'Muddatsiz', ong:'Bajarilmoqda' } : { cls:'m-tugadi', chap:'✓ Bajarilgan', ong:'' };
  const sana = sanaUz(r.muddat), k = h.k;
  if (!h.faol) return { cls:'m-tugadi', chap:'✓ Muddat: '+sana, ong:'Bajarilgan' };
  if (k < 0)   return { cls:'m-qizil', chap:'🔴 Muddat o\'tdi: '+sana, ong:(-k)+' kun kechikdi' };
  if (k === 0) return { cls:'m-bugun', chap:'🟠 Muddat BUGUN: '+sana, ong:'Bugun javob berish kerak' };
  if (k <= 3)  return { cls:'m-sariq', chap:'🟡 Muddat: '+sana, ong:k+' kun qoldi' };
  return { cls:'m-yashil', chap:'🟢 Muddat: '+sana, ong:k+' kun qoldi' };
}
function edoFiltrlar(){
  return EBOLIM==='malumot' ? [['faol','Ko\'rilmagan'],['hammasi','Hammasi']]
    : [['faol','Bajarilmagan'],['kechikkan','Muddati o\'tgan'],['bajarilgan','Bajarilgan'],['hammasi','Hammasi']];
}
function edoChiz(){
  const son = {}, kech = {};
  BOLIMLAR.forEach(([b])=>{ son[b]=0; kech[b]=0; });
  EDO.forEach(r=>{ const h=edoHolat(r); if (h.faol && son[r.bolim]!=null){ son[r.bolim]++; if(h.kechikkan) kech[r.bolim]++; } });
  const asosiy = son.ijro + son.murojaat, kechJami = kech.ijro + kech.murojaat;
  $('edoSon').textContent = asosiy || '';
  $('edoSon').className = asosiy ? 'son'+(kechJami?' qizil':'') : '';
  $('eBolim').innerHTML = BOLIMLAR.map(([b,ik,nom])=>`<button class="${EBOLIM===b?'on':''}" onclick="eBolimTanla('${b}')">
      <b>${son[b]}${kech[b]?` <span class="qiz">· ${kech[b]}⚠</span>`:''}</b>${ik} ${nom}</button>`).join('');

  const mana = EDO.filter(r=>r.bolim===EBOLIM);
  const bugunS = mana.filter(r=>{ const h=edoHolat(r); return h.faol && h.k===0; }).length;
  let og='';
  if (bugunS) og += `<div class="ogoh bugun" onclick="EFILTR='faol';edoChiz()">🔔 Bugun muddati tugaydi: ${bugunS} ta</div>`;
  if (kech[EBOLIM]) og += `<div class="ogoh otgan" onclick="EFILTR='kechikkan';edoChiz()">⚠ Muddati o'tgan: ${kech[EBOLIM]} ta<small>Ko'rish ›</small></div>`;
  $('edoOgoh').innerHTML = og;
  $('edoFilters').innerHTML = edoFiltrlar().map(([k,t])=>`<button class="${EFILTR===k?'on':''}" onclick="EFILTR='${k}';EKOR=EBET;edoChiz()">${t}</button>`).join('');

  const q = $('eq').value.trim().toLowerCase();
  const rows = mana.filter(r=>{
    const h = edoHolat(r);
    if (EFILTR==='faol' && !h.faol) return false;
    if (EFILTR==='kechikkan' && !h.kechikkan) return false;
    if (EFILTR==='bajarilgan' && h.faol) return false;
    if (!q) return true;
    return [r.reg,r.kimdan,r.mazmun,r.rez,r.ijrochilar].join(' ').toLowerCase().includes(q);
  });
  if (EFILTR==='faol'||EFILTR==='kechikkan') rows.sort((a,b)=>(a.muddat||'9999').localeCompare(b.muddat||'9999') || String(b.kelgan||'').localeCompare(String(a.kelgan||'')));
  else rows.sort((a,b)=>String(b.kelgan||'').localeCompare(String(a.kelgan||'')));

  if (!rows.length) { $('edoList').innerHTML = `<div class="empty">${EDO.length?'Bu yerda hujjat yo\'q':'EDO hujjatlari hali kelmagan.<br>Kompyuterdagi Chrome kengaytmasi ishlayotganini tekshiring.'}</div>`; return; }

  const yol = Object.fromEntries(BOLIMLAR.map(b=>[b[0], b[3]]));
  const ikon = Object.fromEntries(BOLIMLAR.map(b=>[b[0], b[1]]));
  $('edoList').innerHTML = rows.slice(0, EKOR).map(r=>{
    const h = edoHolat(r), m = edoMuddat(r, h);
    const edoUrl = 'https://edo.ijro.uz/workflow/inbox/' + yol[r.bolim] + '/' +
      (r.recipient_id && r.doc_id ? encodeURIComponent(r.recipient_id)+'/'+encodeURIComponent(r.doc_id) : 'search');
    const tags = [];
    if (r.ijrochilar) tags.push(`<span class="tag">👤 ${esc(r.ijrochilar)}</span>`);
    if (r.ish_id) tags.push(`<span class="tag ok">✓ Ishlarga qo'shilgan</span>`);
    return `<div class="item ${m?m.cls:''}">
      <div class="top"><span class="no">${ikon[r.bolim]||''}</span><span class="ttl">${esc(r.reg)} — ${esc(r.kimdan||'—')}</span></div>
      <div class="sub">Hujjat sanasi: ${sanaUz(r.sana)||'—'}${r.kelgan?' · keldi '+sanaUz(String(r.kelgan).slice(0,10)):''}</div>
      ${r.mazmun?`<div class="edo-mazmun">${esc(r.mazmun)}</div>`:''}
      ${r.rez?`<div class="edo-rez">✍ ${esc(r.rez)}</div>`:''}
      ${m?`<div class="mud ${m.cls}"><span>${m.chap}</span><small>${esc(m.ong)}</small></div>`:''}
      ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
      <div class="acts">
        ${faylTugma(r.fayl_path ? { path:r.fayl_path } : null, '📄 Hujjat')}
        <a href="${edoUrl}" target="_blank">🔗 EDO</a>
        ${r.bolim==='malumot' ? '' : r.ish_id ? `<button onclick="ochForm(${Number(r.ish_id)})">✎ Ishni ochish</button>`
                  : `<button class="asosiy" onclick="edoIshga('${esc(r.id)}')">＋ Ishga qo'shish</button>`}
      </div></div>`;
  }).join('') + (rows.length > EKOR ? `<button class="yana" onclick="EKOR+=EBET;edoChiz()">Yana ko'rsatish (${rows.length-EKOR} ta qoldi)</button>` : '');
}
async function edoIshga(id){
  const e = EDO.find(x=>x.id===id); if (!e) return;
  band(true);
  try {
    const [d] = await sb('/rest/v1/ishlar', { method:'POST', headers:{ Prefer:'return=representation' }, body:{
      obyekt: String(e.mazmun || (e.reg + ' — ' + (e.kimdan||''))).trim(),
      buyurtmachi: e.kimdan || null, ariza: e.reg || null,
      kelgan: e.sana || (e.kelgan ? String(e.kelgan).slice(0,10) : null), muddat: e.muddat || null,
      izoh: 'EDO ' + (e.bolim==='murojaat'?'murojaat':'topshiriq') + ' ' + e.reg + (e.rez ? ': ' + e.rez : '')
    } });
    ishniKeshga(d);
    const [u] = await sb('/rest/v1/edo?id=eq.'+encodeURIComponent(id), { method:'PATCH', headers:{ Prefer:'return=representation' }, body:{ ish_id: d.id } });
    if (u) edoniKeshga(u);
    toast('✓ Ishlar ro\'yxatiga qo\'shildi');
    rejim('ish'); chiz(); edoChiz(); ochForm(d.id);
  } catch(err){ toast('Qo\'shilmadi: '+(err.message||err), 4000); }
  band(false);
}

/* ---------- Forma ---------- */
function ochForm(row){
  const f = $('f'); f.reset(); const e = F();
  const r = row ? DATA.find(x=>x.row===row) : null;
  $('fTitle').textContent = r ? `№ ${r.n} — tahrirlash` : 'Yangi ish';
  if (r) {
    ['row','obyekt','hajm','lat','lng','buyurtmachi','telefon','ariza','xulosa','kelgan','muddat','shartnoma','shSana','izoh']
      .forEach(k=> e[k].value = r[k]==null?'':r[k]);
    e.summa.value = r.summa===''||r.summa==null?'':Number(r.summa).toLocaleString('ru-RU');
    e.tushgan.value = r.tushgan===''||r.tushgan==null?'':Number(r.tushgan).toLocaleString('ru-RU');
    geoMatn(r.lat && r.lng ? {lat:r.lat,lng:r.lng} : null, r.lat ? 'Saqlangan joylashuv' : null);
    e.tekshirildi.value = r.tekshirildi || ''; $('tekCh').checked = !!r.tekshirildi;
  } else {
    e.row.value = ''; e.kelgan.value = bugun(); e.shSana.value = '';
    joylashuv(false);
  }
  $('faylJoriy').innerHTML = r && r.fayl
    ? '📄 ' + (r.fayl.path ? `<a href="#" onclick="ochFayl('${esc(r.fayl.path)}');return false">${esc(r.fayl.nom)}</a>` : `<a href="${esc(r.fayl.url)}" target="_blank">${esc(r.fayl.nom)}</a>`)
    : 'Fayl yuklanmagan';
  qoldiqHisob();
  korsat('formScr');
}
function orqaga(){ korsat('listScr'); }

function pulInput(el){
  const raw = el.value.replace(/[^\d]/g,'');
  el.value = raw ? Number(raw).toLocaleString('ru-RU') : '';
  qoldiqHisob();
}
function qoldiqHisob(){
  const e=F(); const s=num(e.summa.value), t=num(e.tushgan.value)||0;
  const el=$('qoldiq');
  if (s==null){ el.textContent='—'; el.style.color=''; return; }
  const q=s-t; el.textContent=pul(q); el.style.color = q>0?'var(--warn)':'var(--ok)';
}
function geoMatn(p, sarlavha){
  $('geoInfo').innerHTML = p
    ? `<b>${sarlavha||'Aniqlandi'}${p.acc?` (±${Math.round(p.acc)} m)`:''}</b>${(+p.lat).toFixed(6)}, ${(+p.lng).toFixed(6)}`
    : 'Lokatsiya yo\'q';
}
function joylashuv(qolda){
  const e=F();
  if (!navigator.geolocation){ $('geoInfo').textContent='Telefon lokatsiyani qo\'llamaydi — qo\'lda kiriting'; return; }
  $('geoInfo').textContent='Aniqlanmoqda…';
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude.toFixed(6), lng=p.coords.longitude.toFixed(6);
    e.lat.value=lat; e.lng.value=lng;
    geoMatn({lat,lng,acc:p.coords.accuracy});
    if (qolda) toast('Lokatsiya yangilandi');
  }, err=>{
    $('geoInfo').innerHTML = '<b style="color:var(--bad)">Lokatsiya olinmadi</b>' +
      (err.code===1 ? 'Brauzerga lokatsiya ruxsatini bering' : 'GPS ni yoqing va “Yangilash”ni bosing');
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

const sanaN = v => v ? v : null;
async function saqla(){
  const e=F();
  if (!e.obyekt.value.trim()){ toast('Obyekt manzili va nomini kiriting'); e.obyekt.focus(); return; }
  const v = k => e[k].value.trim();
  const rec = {
    obyekt: v('obyekt'), hajm: v('hajm')||null, lat: v('lat')||null, lng: v('lng')||null,
    buyurtmachi: v('buyurtmachi')||null, telefon: v('telefon')||null, ariza: v('ariza')||null, xulosa: v('xulosa')||null,
    kelgan: sanaN(v('kelgan')), muddat: sanaN(v('muddat')), shartnoma: v('shartnoma')||null, sh_sana: sanaN(v('shSana')),
    izoh: v('izoh')||null, tekshirildi: sanaN(e.tekshirildi.value),
    summa: num(e.summa.value.replace(/[^\d]/g,'')), tushgan: num(e.tushgan.value.replace(/[^\d]/g,''))
  };
  const row = Number(v('row')) || 0;
  const fayl = e.fayl.files && e.fayl.files[0];
  band(true);
  try {
    let [d] = row
      ? await sb('/rest/v1/ishlar?id=eq.'+row, { method:'PATCH', headers:{ Prefer:'return=representation' }, body:rec })
      : await sb('/rest/v1/ishlar', { method:'POST', headers:{ Prefer:'return=representation' }, body:rec });
    if (fayl) {
      toast('Xulosa yuklanmoqda…', 60000);
      const yol = await faylYukla('xulosa/'+d.id, fayl);
      [d] = await sb('/rest/v1/ishlar?id=eq.'+d.id, { method:'PATCH', headers:{ Prefer:'return=representation' },
        body:{ fayl_path: yol, fayl_nom: fayl.name, fayl_url: null } });
      toast('✓ Saqlandi, xulosa joylandi');
    } else toast('✓ Saqlandi');
    ishniKeshga(d); korsat('listScr'); chiz();
  } catch(err){ toast('Saqlanmadi: '+(err.message||err), 5000); }
  band(false);
}

/* ---------- Binoga borib tekshirildi ---------- */
function tekCheck(ch){ const e=F(); e.tekshirildi.value = ch.checked ? (e.tekshirildi.value || bugun()) : ''; }
async function tekBelgila(row){
  band(true);
  try {
    const [d] = await sb('/rest/v1/ishlar?id=eq.'+row, { method:'PATCH', headers:{ Prefer:'return=representation' }, body:{ tekshirildi: bugun() } });
    ishniKeshga(d); chiz();
    toast('🔍 Tekshirildi deb belgilandi — muddat eslatmasi endi kelmaydi', 3500);
  } catch(e){ toast('Saqlanmadi: '+(e.message||e), 4000); }
  band(false);
}

const MAX_MB = 20;
function faylTanlandi(el){
  const f = el.files && el.files[0]; if (!f) return;
  if (f.size > MAX_MB*1024*1024) { toast(`Fayl juda katta (${MAX_MB} MB dan oshmasin)`, 4000); el.value=''; return; }
  $('faylJoriy').innerHTML = `📎 ${esc(f.name)} <small>(${(f.size/1024/1024).toFixed(1)} MB) — “Saqlash” bosilganda yuklanadi</small>`;
}
